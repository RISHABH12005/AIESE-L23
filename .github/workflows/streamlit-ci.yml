name: Streamlit CI

on:
  push:
    branches:
      - main
    paths:
      - "AISE_Cloud_Deployment_Practical/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "AISE_Cloud_Deployment_Practical/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AISE_Cloud_Deployment_Practical

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AISE_Cloud_Deployment_Practical/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Smoke test Streamlit app
        run: |
          set -e
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/ > /dev/null; then
              echo "Streamlit app started and responded successfully."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat streamlit.log
          echo "Streamlit app failed to become ready in time."
          exit 1
